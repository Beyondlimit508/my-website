<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome to My World</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #050505, #111827, #000000);
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow: hidden;
    }

    .container {
        animation: appear 1.5s ease;
    }

    h1 {
        font-size: 45px;
        margin-bottom: 15px;
        letter-spacing: 2px;
    }

    p {
        color: #aaa;
        font-size: 18px;
        margin-bottom: 40px;
    }

    .enter {
        display: inline-block;
        padding: 16px 50px;
        background: white;
        color: black;
        text-decoration: none;
        font-size: 20px;
        font-weight: bold;
        border-radius: 50px;
        transition: 0.3s;
    }

    .enter:hover {
        transform: scale(1.1);
        background: #00e5ff;
        box-shadow: 0 0 30px #00e5ff;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 32px;
        }

        p {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Welcome to My World, Ahmed</h1>

    <p>Everything you need to know about me.</p>

    <a href="home.html" class="enter">ENTER</a>

</div>

</body>
</html>
