<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ahmed's World</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #050505;
        color: white;
        font-family: Arial, sans-serif;
    }

    header {
        padding: 25px;
        text-align: center;
        background: #0d0d0d;
        border-bottom: 1px solid #222;
    }

    header h1 {
        font-size: 32px;
    }

    header p {
        color: #888;
        margin-top: 8px;
    }

    .content {
        max-width: 900px;
        margin: auto;
        padding: 40px 20px;
    }

    .welcome {
        text-align: center;
        margin-bottom: 40px;
    }

    .welcome h2 {
        font-size: 30px;
        margin-bottom: 10px;
    }

    .welcome p {
        color: #aaa;
    }

    .post {
        background: #111;
        border: 1px solid #222;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 25px;
    }

    .post h3 {
        margin-bottom: 12px;
    }

    .post p {
        color: #bbb;
        line-height: 1.6;
    }

    .back {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 25px;
        background: white;
        color: black;
        text-decoration: none;
        border-radius: 25px;
        font-weight: bold;
    }
</style>
</head>

<body>

<header>
    <h1>Ahmed's World</h1>
    <p>Welcome to my website</p>
</header>

<div class="content">

    <div class="welcome">
        <h2>My Content</h2>
        <p>This is where I will share my things.</p>
    </div>

    <div class="post">
        <h3>Welcome 👋</h3>
        <p>
            Welcome to my personal website.
            This is my space where I can share my photos,
            videos, projects, updates and anything else I want.
        </p>
    </div>

    <div class="post">
        <h3>My Latest Post</h3>
        <p>
            I will put my latest content here.
        </p>
    </div>

    <a href="index.html" class="back">← BACK</a>

</div>

</body>
</html>
